    <title>김진형 · Luka | 개발자 포트폴리오</title>
    <script>
      (() => {
        let dark = true
        try {
          const saved = localStorage.getItem('darkMode')
          if (saved === 'true' || saved === 'false') dark = saved === 'true'
        } catch { /* Use the default theme when storage is unavailable. */ }
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name="theme-color"]').content = '#09090b'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>이 포트폴리오를 보려면 JavaScript를 활성화해 주세요. GitHub: <a href="https://github.com/rem0116kjh">rem0116kjh</a></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
